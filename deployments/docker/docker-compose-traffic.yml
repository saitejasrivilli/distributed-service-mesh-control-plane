services:
  control-plane:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["/control-plane"]
    environment:
      CP_HTTP_ADDR: ":8080"
      CP_XDS_ADDR: ":18000"
      CP_RECONCILE_INTERVAL: "1s"
    ports:
      - "8080:8080"
      - "18000:18000"
    networks: [mesh]

  backend-a-v1:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["-addr=:9000", "-name=backend-a", "-version=v1"]
    networks: [mesh]

  backend-a-v2:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["-addr=:9000", "-name=backend-a", "-version=v2"]
    networks: [mesh]

  envoy-dynamic:
    image: envoyproxy/envoy:v1.31-latest
    volumes:
      - ../envoy/envoy-dynamic.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "20000:20000"
      - "9903:9901"
    depends_on: [control-plane]
    networks: [mesh]

networks:
  mesh:
    driver: bridge
