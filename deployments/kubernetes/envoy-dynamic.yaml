apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-dynamic-config
data:
  envoy.yaml: |
    node:
      id: demo-envoy
      cluster: demo
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    dynamic_resources:
      ads_config:
        api_type: GRPC
        transport_api_version: V3
        grpc_services:
          - envoy_grpc: { cluster_name: xds_cluster }
      cds_config:
        resource_api_version: V3
        ads: {}
      lds_config:
        resource_api_version: V3
        ads: {}
    static_resources:
      clusters:
        - name: xds_cluster
          connect_timeout: 1s
          type: STRICT_DNS
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: xds_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address: { address: control-plane, port_value: 18000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-dynamic
  labels: { app: envoy-dynamic }
spec:
  replicas: 1
  selector:
    matchLabels: { app: envoy-dynamic }
  template:
    metadata:
      labels: { app: envoy-dynamic }
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.31-latest
          ports:
            - { name: backend-a, containerPort: 20000 }
            - { name: admin, containerPort: 9901 }
          volumeMounts:
            - { name: config, mountPath: /etc/envoy }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
      volumes:
        - name: config
          configMap: { name: envoy-dynamic-config }
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-dynamic
spec:
  selector: { app: envoy-dynamic }
  ports:
    - { name: backend-a, port: 20000, targetPort: 20000 }
    - { name: admin, port: 9901, targetPort: 9901 }
